version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shift_scheduler_db
    environment:
      POSTGRES_USER: scheduler_user
      POSTGRES_PASSWORD: scheduler_password
      POSTGRES_DB: shift_scheduler_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_user -d shift_scheduler_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shift_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shift_scheduler_backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: scheduler_user
      POSTGRES_PASSWORD: scheduler_password
      POSTGRES_DB: shift_scheduler_db
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - shift_network
    command: python shift_scheduler_backend_v2.py

volumes:
  postgres_data:

networks:
  shift_network:
    driver: bridge
